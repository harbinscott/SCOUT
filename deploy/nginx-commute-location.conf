# Insert these blocks INSIDE the existing `server { listen 443 ssl; ... }`
# in /etc/nginx/sites-enabled/<your-site>, immediately before `location / {`.
# This file is a reference snippet; do not execute it in Bash and do not place
# it directly in nginx/conf.d unless that file is included from inside a server.

location = /commute {
    return 308 /commute/;
}

location ^~ /commute/ {
    # No trailing slash here: SCOUT must receive the /commute prefix.
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
