# Add these blocks inside your existing Nginx HTTPS server block.
# Nginx terminates TLS; SCOUT listens on loopback HTTP port 3001.

location = /scout {
    return 308 /scout/;
}

location ^~ /scout/ {
    # No trailing slash here: SCOUT must receive the /scout prefix.
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# Preserve the two former entry URLs as redirects for saved bookmarks.
location = /commute {
    return 308 /scout/;
}

location = /commute/ {
    return 308 /scout/;
}
