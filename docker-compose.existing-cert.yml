services:
  app:
    environment:
      TLS_CERT_FILE: /run/secrets/sc_tls_cert.pem
      TLS_KEY_FILE: /run/secrets/sc_tls_key.pem
    volumes:
      - ${SC_TLS_CERT_HOST_PATH:?Set SC_TLS_CERT_HOST_PATH}:/run/secrets/sc_tls_cert.pem:ro
      - ${SC_TLS_KEY_HOST_PATH:?Set SC_TLS_KEY_HOST_PATH}:/run/secrets/sc_tls_key.pem:ro
